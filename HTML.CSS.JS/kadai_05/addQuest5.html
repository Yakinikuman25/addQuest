<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追加課題5</title>
</head>
<body>
  <div id="all">
    <!-- 目的地のドロップダウン -->
    <div id="all-goal">
      <label>目的地</label> 
      <select id="user-goal" name="user-goal"> 
        <option value="error">選択してください</option>
        <option value="北海道">北海道</option> 
        <option value="東京">東京</option> 
        <option value="大阪">大阪</option> 
        <option value="福岡">福岡</option>
        <option value="沖縄">沖縄</option>
      </select>
    </div>
    <br>

    <div id="all-entarant">
      <!-- 参加人数のドロップダウン -->
      <label>参加人数</label> 
      <select id="user-entrant" name="userEntrant"> 
        <option value="error">選択してください</option>
        <option value= "1">1</option> 
        <option value="2">2</option> 
        <option value="3">3</option> 
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </div>
    <br>

    <div id="all-stay">
      <!-- 宿泊数のラジオボタン -->
      <label>宿泊数：選択してください</label>
      <form id="user-stay" name="userStay">
        <input type="radio" name="stay" value="1">1泊
        <input type="radio" name="stay" value="2">2泊
        <input type="radio" name="stay" value="3">3泊
        <input type="radio" name="stay" value="4">4泊
        <input type="radio" name="stay" value="5">5泊
      </form>
    </div>

    <div id="all-text">
      <!-- テキストを入力 -->
      <label>メッセージ</label> 
      <textarea id="user-text" name="text" placeholder="記入してください"></textarea>
    </div> 
    <br>

    <div>
      <!--ボタン  -->
      <button id="user-btn">出力</button>
    </div>
    <br>
    
    <!-- 出力結果を表示する -->    
    <div id="output">
    </div>

  </div>
  <script src="addQuest5.js"></script>
</body>
</html>
