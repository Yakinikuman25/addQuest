<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追加課題5</title>
</head>
<body>
  <div id="all">
    <!-- 目的地のドロップダウン -->
    <div id="all-goal">
      <label>目的地</label> 
      <select id="user-goal" name="user-goal"> 
        <option>選択してください</option>
        <option value="goal1">北海道</option> 
        <option value="goal2">東京</option> 
        <option value="goal3">大阪</option> 
        <option value="goal4">福岡</option>
        <option value="goal5">沖縄</option>
      </select>
    </div>
    <br>

    <div id="all-entarant">
      <!-- 参加人数のドロップダウン -->
      <label>参加人数</label> 
      <select id="user-entrant" name="user-entrant"> 
        <option>選択してください</option>
        <option value="entrant1">1</option> 
        <option value="entrant2">2</option> 
        <option value="entrant3">3</option> 
        <option value="entrant4">4</option>
        <option value="entrant5">5</option>
        <option value="entrant6">6</option>
        <option value="entrant7">7</option>
        <option value="entrant8">8</option>
        <option value="entrant9">9</option>
      </select>
    </div>
    <br>

    <div id="all-stay">
      <!-- 宿泊数のラジオボタン -->
      <label>宿泊数：選択してください</label>
      <form id="user-stay" name="userStay">
        <input type="radio" name="stay" value="stay1">1泊
        <input type="radio" name="stay" value="stay2">2泊
        <input type="radio" name="stay" value="stay3">3泊
        <input type="radio" name="stay" value="stay4">4泊
        <input type="radio" name="stay" value="stay5">5泊
      </form>
    </div>

    <div id="all-text">
      <!-- テキストを入力 -->
      <label>メッセージ</label> 
      <textarea id="user-text" name="text">記入してください</textarea>
    </div> 
    <br>

    <div id="user-btn">
      <!--ボタン  -->
      <button id="user-btn">出力</button>
    </div>

  </div>
  <script src="addQuest5.js"></script>
</body>
</html>
